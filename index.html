<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>商業模式畫布即時看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* 版面：頂端品牌列＋「內部／外部 × 有利／不利」2×2 矩陣；每一格右上角各有一個 QR code，回答以便條形式流入。 */
:root{
  --c1:#27506e; --c2:#16303f; --c3:#7fa8c4; --c4:#1a1f26;
  --on1:#fff; --on2:#fff; --on3:#111; --on4:#fff;
  --ink:#15181d; --ink-2:#555b66;
  --paper:color-mix(in srgb,var(--c1) 4%,#fff);
  --line:color-mix(in srgb,var(--c1) 14%,#e3e5e9);
  --ok:#1b7f4b; --warn:#a15c00; --bad:#b3261e;
  --font-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-display:"Archivo",var(--font-zh);
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
.f-serif{--font-zh:"Noto Serif TC","PMingLiU",serif;--font-display:"Fraunces",var(--font-zh)}
*{box-sizing:border-box}
html,body{height:100%}
html{font-size:clamp(13px,.62vw + .75vh,26px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-zh);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c1) 55%,#fff);outline-offset:2px}
[hidden]{display:none!important}
[data-q="v"]{--q:var(--c1);--qon:var(--on1)}
[data-q="g"],[data-q="c"],[data-q="h"]{--q:var(--c2);--qon:var(--on2)}
[data-q="x"],[data-q="m"]{--q:var(--c3);--qon:var(--on3)}
[data-q="p"],[data-q="a"],[data-q="r"]{--q:var(--c4);--qon:var(--on4)}
.ico{display:block;width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ───────── 老師看板 ───────── */
body.host{display:grid;grid-template-rows:auto auto 1fr auto;height:100dvh;overflow:hidden}
.foot{margin:0;padding:.4rem 1.2rem .5rem;font-size:.8rem;line-height:1.5;color:var(--ink);white-space:pre-line;border-top:1px solid var(--line);background:#fff}
body.editing [data-tx],body.editing .ans [data-f]{outline:1.5px dashed color-mix(in srgb,var(--c1) 55%,#777);outline-offset:2px;border-radius:.2rem;cursor:text;min-width:1.5em}
body.editing .top [data-tx]{outline-color:color-mix(in srgb,var(--on1) 75%,transparent)}
body.editing .ans .x{opacity:1}
body.editing .ans .n{display:inline-block}
body.editing .ans .n:empty::before{content:'學號';opacity:.5}
.top{display:flex;align-items:center;gap:.9rem;padding:.55rem 1.2rem;background:var(--c1);color:var(--on1);flex-wrap:wrap}
.logo{height:2.5rem;max-width:8rem;object-fit:contain;background:#fff;padding:.2rem;border-radius:.3rem}
.co{font:800 1.9rem/1.15 var(--font-display);background:transparent;border:0;border-bottom:2px dashed transparent;color:inherit;padding:.1rem .15rem;min-width:6em;max-width:100%;field-sizing:content}
@supports not (field-sizing:content){.co{width:11em}}
.co::-webkit-calendar-picker-indicator{display:none!important}
.co:placeholder-shown{min-width:12.5em}
.co::placeholder{color:color-mix(in srgb,var(--on1) 62%,transparent)}
.co:hover,.co:focus{border-bottom-color:color-mix(in srgb,var(--on1) 60%,transparent);outline:0}
.tag{font:600 .8rem var(--font-display);letter-spacing:.14em;border:1.5px solid currentColor;border-radius:99px;padding:.18rem .7rem;white-space:nowrap}
.remind-top{font-size:.86rem;font-weight:700;background:color-mix(in srgb,var(--on1) 16%,transparent);border-radius:.35rem;padding:.22rem .7rem}
.grow{flex:1}
.meta{display:flex;align-items:center;gap:.8rem;font-size:.78rem;white-space:nowrap}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:#f0b429;display:inline-block;margin-right:.35rem;box-shadow:0 0 0 2px color-mix(in srgb,var(--on1) 35%,transparent)}
.dot.up{background:#35c46f}.dot.down{background:#e5484d}
.num{font-variant-numeric:tabular-nums}
.btn{background:transparent;border:1px solid color-mix(in srgb,var(--on1) 45%,transparent);color:var(--on1);padding:.32rem .75rem;border-radius:.4rem;font-size:.78rem;font-weight:500;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--on1) 14%,transparent)}
.btn[aria-pressed="true"]{background:var(--on1);color:var(--c1)}
.bar{padding:.5rem 1.2rem;font-size:.82rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;background:#fff4d6;color:#4d3800;border-bottom:1px solid #e8cf87}
.bar button{background:#fff;border:1px solid #c9a94b;border-radius:.35rem;padding:.2rem .7rem;font-size:.78rem}
.bar .go{background:#4d3800;color:#fff;border-color:#4d3800}

/* 商業模式畫布：上方五欄（左＝基礎設施、中＝價值主張、右＝顧客），下方成本與收益 */
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:1fr 1fr .78fr;grid-template-areas:"p p a a v v c c g g" "p p r r v v h h g g" "x x x x x m m m m m";gap:.4rem;padding:.5rem 1.2rem .6rem;min-height:0}
.quad[data-q="p"]{grid-area:p}.quad[data-q="a"]{grid-area:a}.quad[data-q="r"]{grid-area:r}.quad[data-q="v"]{grid-area:v}.quad[data-q="c"]{grid-area:c}.quad[data-q="h"]{grid-area:h}.quad[data-q="g"]{grid-area:g}.quad[data-q="x"]{grid-area:x}.quad[data-q="m"]{grid-area:m}
.ax{font:600 .68rem var(--font-display);letter-spacing:.16em;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:.6em;white-space:nowrap}
.ax b{font-family:var(--font-zh);font-weight:700;letter-spacing:.1em;color:var(--ink)}
.ax.row{position:relative}
.ax.row span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);display:flex;gap:.6em;align-items:center}
.quad{background:color-mix(in srgb,var(--q) 8%,#fff);border:1px solid color-mix(in srgb,var(--q) 32%,#fff);border-radius:.5rem;display:grid;grid-template-rows:1fr auto;min-height:0;min-width:0;overflow:hidden}
.q-body{overflow-y:auto;min-height:0;padding:.5rem .5rem .2rem}
.q-head{display:flex;gap:.55rem;align-items:flex-start;margin-bottom:.45rem}
.q-letter{flex:none;width:2.5rem;height:2.5rem;display:grid;place-items:center;background:var(--q);color:var(--qon);font:800 2.9rem/1 var(--font-display);border-radius:.35rem;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1)}
.q-title{min-width:0}
.q-title h2{font:900 1.2rem/1.15 var(--font-zh);margin:0;display:flex;flex-direction:column;gap:.1rem}
.q-title h2 .en{order:-1;font:600 .6rem var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.q-prompt{margin:.25rem 0 0;font-size:.7rem;line-height:1.45;color:var(--ink-2);max-width:32em;text-wrap:pretty}
.q-qr{background:#fff;border:1px solid var(--line);border-radius:.35rem;padding:.25rem .25rem .1rem;width:clamp(70px,11vh,140px);display:grid;gap:.1rem;cursor:zoom-in;color:var(--ink-2);float:right;margin:0 0 .4rem .5rem}
.q-qr svg{display:block;width:100%;height:auto}
.q-off{aspect-ratio:1;display:grid;place-items:center;text-align:center;background:#fff4d6;color:#4d3800;border:2px dashed #c9a94b;border-radius:.3rem;font-weight:700;font-size:.66rem;line-height:1.4}
.q-qr span{font-size:.52rem;letter-spacing:.08em;text-align:center}
.q-list{list-style:none;margin:0;padding:0;font-size:var(--fs,1.15rem)}
.ans{background:#fff;border:1px solid color-mix(in srgb,var(--q) 38%,#fff);border-radius:.35rem;padding:.28em .6em;line-height:1.35;max-width:100%;overflow-wrap:anywhere;display:inline-block;margin:0 .4rem .4rem 0;vertical-align:top}
.ans .n{font-size:.7em;color:var(--ink-2);white-space:nowrap;margin-left:.5em}
.ans .x{border:0;background:transparent;color:inherit;font-size:.75em;line-height:1;padding:0;margin-left:.4em;opacity:0}
.ans:hover .x,.ans .x:focus-visible{opacity:1}
.ans.fresh{animation:pop 2.6s ease-out both}
@keyframes pop{0%{background:var(--q);color:var(--qon);transform:scale(.9)}10%{transform:scale(1.05)}20%{transform:scale(1)}65%{background:var(--q);color:var(--qon)}100%{background:#fff;color:var(--ink)}}
.q-empty{color:var(--ink-2);font-size:.8rem}
.q-foot{font-size:.66rem!important;display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.2rem .65rem .4rem;font-size:.72rem;color:var(--ink-2)}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:.2em}
.q-foot form{display:flex;gap:.3rem;flex:1;justify-content:flex-end}
.q-foot input{flex:1;max-width:22em;border:1px solid var(--line);border-radius:.3rem;padding:.15rem .45rem;background:#fff}
.q-foot form button{border:1px solid var(--line);background:#fff;border-radius:.3rem;padding:.15rem .6rem}
body.names-off .ans .n{display:none}

.drawer{position:fixed;inset:0 0 0 auto;width:min(23rem,100vw);background:#fff;color:var(--ink);box-shadow:-.4rem 0 2rem rgb(0 0 0 / .18);padding:1rem 1.1rem 1.4rem;overflow-y:auto;z-index:20;display:grid;gap:1rem;align-content:start;font-size:.85rem}
.drawer h2{font:900 1.1rem var(--font-zh);margin:0;display:flex;justify-content:space-between;align-items:center}
.drawer h3{font:700 .72rem var(--font-zh);letter-spacing:.12em;color:var(--ink-2);margin:0 0 .4rem}
.drawer section{border-top:1px solid var(--line);padding-top:.8rem}
.drawer p{margin:.4rem 0 0;color:var(--ink-2);font-size:.76rem}
.drawer .field{display:grid;gap:.25rem;font-size:.78rem;font-weight:700;margin-top:.5rem}
.pw{display:flex;gap:.3rem;margin-top:.25rem}
.pw input{flex:1;min-width:0;border:1px solid var(--line);border-radius:.3rem;padding:.3rem .5rem;background:#fff;font-family:var(--font-mono);letter-spacing:.08em}
.pw input.mask{-webkit-text-security:disc}
.eye{flex:none;width:2.3rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:.3rem;background:#fff;color:var(--ink-2);padding:0}
.eye:hover{background:var(--paper);color:var(--ink)}
.eye svg{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .i-on{display:none}
.eye[aria-pressed="true"] .i-on{display:block}
.eye[aria-pressed="true"] .i-off{display:none}
.drawer .field input,.drawer .field textarea{font-weight:400;border:1px solid var(--line);border-radius:.3rem;padding:.3rem .5rem;background:#fff;width:100%}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.swatches label{display:grid;gap:.2rem;font-size:.74rem}
.swatches input{width:100%;height:2.2rem;padding:0;border:1px solid var(--line);border-radius:.3rem;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:.4rem;overflow:hidden}
.seg button{border:0;background:#fff;padding:.3rem .9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.plain{border:1px solid var(--line);background:#fff;border-radius:.4rem;padding:.3rem .75rem}
.plain:hover{background:var(--paper)}
.plain.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,#fff)}
.check{display:flex;gap:.5rem;align-items:center}
.check input{width:1.05rem;height:1.05rem;accent-color:var(--c1)}
.code{font-family:var(--font-mono);letter-spacing:.12em}
dialog.zoom{border:0;border-radius:.8rem;padding:1.4rem 1.6rem 1.2rem;max-width:94vw;text-align:center;color:var(--ink);box-shadow:0 1rem 4rem rgb(0 0 0 / .4)}
dialog.zoom::backdrop{background:rgb(10 12 16 / .72)}
dialog.zoom h2{margin:0 0 .6rem;font:900 1.8rem var(--font-zh);display:flex;gap:.7rem;align-items:center;justify-content:center}
dialog.zoom h2 i{font-style:normal;background:var(--q);color:var(--qon);width:2.6rem;height:2.6rem;display:grid;place-items:center;border-radius:.3rem}
dialog.zoom svg{width:min(66vh,80vw);height:auto;display:block}
dialog.zoom.guide{text-align:left;max-width:min(42rem,94vw);font-size:.95rem}
dialog.zoom.guide h2{justify-content:flex-start;font-size:1.4rem}
dialog.zoom.guide p{font-size:.95rem;color:var(--ink);margin:.4rem 0}
dialog.zoom.guide ol{margin:.6rem 0;padding-left:1.4rem;display:grid;gap:.45rem}
dialog.zoom.guide code{font-family:var(--font-mono);background:var(--paper);border:1px solid var(--line);border-radius:.25rem;padding:0 .3em;overflow-wrap:anywhere}
dialog.zoom.guide .plain{margin-top:.6rem}
dialog.zoom p.remind{font-size:1.25rem;font-weight:700;color:var(--ink);margin-top:.7rem}
dialog.zoom p{margin:.5rem 0 0;font-size:.74rem;color:var(--ink-2);overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1rem;border-radius:.5rem;font-size:.82rem;z-index:30;max-width:92vw;text-align:center}

@media (max-width:760px){
  body.host{height:auto;overflow:auto;display:block}
  .board{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:none;padding:.6rem 16px 1.5rem}
  .board .quad{grid-area:auto;min-height:14rem}
  .quad[data-q="g"]{order:1}.quad[data-q="v"]{order:2}.quad[data-q="h"]{order:3}.quad[data-q="c"]{order:4}.quad[data-q="m"]{order:5}.quad[data-q="r"]{order:6}.quad[data-q="a"]{order:7}.quad[data-q="p"]{order:8}.quad[data-q="x"]{order:9}
}

/* ───────── 學生作答頁 ───────── */
html.stu{font-size:16px}
body.student{min-height:100%;display:flex;flex-direction:column}
.s-top{background:var(--c1);color:var(--on1);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.s-top strong{font:800 1.3rem/1.2 var(--font-display);overflow-wrap:anywhere}
.s-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 16px 0}
.s-tabs button{--b:color-mix(in srgb,var(--q) 40%,#fff);border:1.5px solid var(--b);background:#fff;border-radius:8px;padding:6px 2px;display:grid;justify-items:center;line-height:1.2;min-width:0}
.s-tabs b{width:1.5rem;height:1.5rem;display:grid;place-items:center}
.s-tabs b .ico{width:100%;height:100%}
.s-tabs small{font-size:.74rem;color:var(--ink-2)}
.s-tabs button[aria-pressed="true"]{background:var(--q);color:var(--qon);border-color:var(--q)}
.s-tabs button[aria-pressed="true"] small{color:inherit}
.s-main{padding:16px;display:grid;gap:14px;max-width:34rem;width:100%;margin:0 auto}
.s-q{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.s-q .q-letter{width:3.2rem;height:3.2rem}
.s-q h1{margin:0;font:900 1.5rem/1.15 var(--font-zh)}
.s-q h1 span{display:block;font:600 .72rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-top:2px}
.s-ask{margin:0;font-size:1rem;text-wrap:pretty}
.s-form{display:grid;gap:10px}
.s-form label{display:grid;gap:4px;font-size:.82rem;font-weight:700}
.s-form label span{display:flex;justify-content:space-between;font-weight:700}
.s-form label span i{font-style:normal;font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
.s-form textarea,.s-form input{font-size:1.05rem;font-weight:400;border:1.5px solid color-mix(in srgb,var(--q) 45%,#c9ccd2);border-radius:8px;padding:10px 12px;background:#fff;width:100%;resize:vertical}
.s-note{margin:0;padding:10px 12px;border-radius:8px;background:#fff4d6;border:1px solid #e8cf87;color:#4d3800;font-size:.9rem;line-height:1.5}
.s-form input.bad{border-color:var(--bad);background:#fff5f4}
.s-send{min-height:50px;border:0;border-radius:8px;background:var(--q);color:var(--qon);font-weight:700;font-size:1.05rem;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1)}
.s-send:disabled{opacity:.5;cursor:not-allowed}
.s-status{font-size:.82rem;color:var(--ink-2);margin:0;min-height:1.3em}
.s-status.bad{color:var(--bad)}
.s-sent{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.s-sent li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.92rem}
.s-sent li b{font:700 .74rem var(--font-zh);white-space:nowrap;background:var(--q);color:var(--qon);border-radius:4px;padding:1px 6px}
.s-sent li span{overflow-wrap:anywhere;min-width:0}
.s-sent li em{font-style:normal;font-size:.74rem;white-space:nowrap}
.s-sent .shown{color:var(--ok)}.s-sent .sending{color:var(--warn)}.s-sent .failed{color:var(--bad)}
.s-h{font:700 .74rem var(--font-zh);letter-spacing:.12em;color:var(--ink-2);margin:6px 0 0}
.s-foot{margin-top:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));font-size:.8rem;line-height:1.6;color:var(--ink);white-space:pre-line;border-top:1px solid var(--line);background:#fff}
.s-teach{display:grid;gap:12px;border:2px solid var(--c1);border-radius:10px;padding:12px;background:#fff}
.s-teach h2{margin:0;font:900 1.05rem var(--font-zh);display:flex;justify-content:space-between;align-items:center;gap:8px}
.s-teach h3{margin:8px 0 4px;font:700 .86rem var(--font-zh);display:flex;gap:6px;align-items:center}
.s-teach h3 b{width:1.5rem;height:1.5rem;display:grid;place-items:center;background:var(--q);color:var(--qon);border-radius:4px}
.s-teach p{margin:0;font-size:.82rem;color:var(--ink-2)}
.t-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.t-list li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:6px;font-size:.95rem}
.t-list li>span{overflow-wrap:anywhere}
.t-list small{color:var(--ink-2);margin-left:8px}
.t-list .acts{display:flex;gap:6px;flex-wrap:wrap}
.t-list input,.t-form input,.t-form textarea{font-size:1rem;font-weight:400;border:1.5px solid #c9ccd2;border-radius:8px;padding:8px 10px;width:100%;background:#fff}
.s-teach .plain{font-size:.86rem;padding:6px 12px;border-radius:8px}
.t-form{display:grid;gap:8px;margin-top:8px}
.t-form label{display:grid;gap:3px;font-size:.8rem;font-weight:700}
.s-teach summary{font-weight:700;font-size:.9rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){.ans.fresh{animation-duration:.01s}}
</style>
</head>
<body>
<noscript>這個頁面需要開啟 JavaScript 才能使用。</noscript>

<template id="t-host">
  <header class="top">
    <img class="logo" id="logo" alt="" hidden>
    <input class="co" id="company" list="brands" maxlength="30" autocomplete="off" spellcheck="false" placeholder="輸入公司名稱，按 Enter" aria-label="公司名稱">
    <datalist id="brands"></datalist>
    <span class="tag">商業模式畫布</span>
    <span class="remind-top" data-tx="remind"></span>
    <span class="grow"></span>
    <span class="meta">
      <span id="conn"><i class="dot"></i><span>連線中</span></span>
      <span>已收到 <b class="num" id="total">0</b> 則</span>
      <span>場次 <b class="code" id="roomcode"></b></span>
    </span>
    <button class="btn" id="b-lock" aria-pressed="false">暫停作答</button>
    <button class="btn" id="b-edit" aria-pressed="false">編輯內容</button>
    <button class="btn" id="b-set">設定</button>
    <button class="btn" id="b-full">全螢幕</button>
  </header>
  <div id="bars"></div>
  <main class="board">
    <section class="quad" data-q="p"></section>
    <section class="quad" data-q="a"></section>
    <section class="quad" data-q="r"></section>
    <section class="quad" data-q="v"></section>
    <section class="quad" data-q="c"></section>
    <section class="quad" data-q="h"></section>
    <section class="quad" data-q="g"></section>
    <section class="quad" data-q="x"></section>
    <section class="quad" data-q="m"></section>
  </main>
  <footer class="foot" data-tx="foot"></footer>
  <aside class="drawer" id="drawer" hidden aria-label="設定">
    <h2>設定 <button class="plain" id="d-close">關閉</button></h2>
    <section>
      <h3>品牌色</h3>
      <div class="swatches">
        <label>主色<input type="color" id="col1"></label>
        <label>輔色<input type="color" id="col2"></label>
        <label>強調色<input type="color" id="col3"></label>
      </div>
      <div class="row" style="margin-top:.5rem"><button class="plain" id="d-auto">還原自動配色</button></div>
      <p id="d-src"></p>
    </section>
    <section>
      <h3>字體</h3>
      <div class="seg" id="d-font"><button data-f="sans">黑體</button><button data-f="serif">明體</button></div>
    </section>
    <section>
      <h3>公司標誌（選用）</h3>
      <div class="row">
        <input type="file" id="d-logo" accept="image/png,image/jpeg,image/svg+xml,image/webp" aria-label="上傳標誌圖檔">
        <button class="plain" id="d-logo-x">移除標誌</button>
      </div>
      <p>圖檔只存在這台電腦的瀏覽器裡，顯示在看板左上角，不會傳到學生手機。</p>
    </section>
    <section>
      <h3>作答</h3>
      <label class="check"><input type="checkbox" id="d-names"> 在看板上顯示學號</label>
      <p>學生作答前必須先填學號。取消勾選後看板不顯示學號，匯出的 CSV 仍會保留。</p>
      <div class="row" style="margin-top:.6rem">
        <button class="plain" id="d-csv">匯出 CSV</button>
        <button class="plain danger" id="d-clear">清空回答</button>
      </div>
    </section>
    <section>
      <h3>老師</h3>
      <label class="field" for="d-tid">老師學號</label>
      <div class="pw"><input id="d-tid" maxlength="24" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore><button type="button" class="eye" id="d-eye" aria-pressed="false" aria-label="顯示老師學號" title="顯示老師學號"><svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
      <p>在手機作答頁的學號欄輸入這組學號，就會進入老師模式：可修改或刪除所有回答、暫停作答、修改頁面文字。預設的 000000 很容易被猜到，上課前建議改成只有你知道的號碼。</p>
      <label class="field">手機作答頁的提醒文字<textarea id="d-note" rows="3" maxlength="120"></textarea></label>
      <p>看板上的其他文字，請按上方的「編輯內容」後直接點文字修改。</p>
      <div class="row" style="margin-top:.5rem"><button class="plain" id="d-txreset">還原所有預設文字</button></div>
    </section>
    <section>
      <h3>場次</h3>
      <div class="row"><span>代碼 <b class="code" id="d-room"></b></span><button class="plain" id="d-new">開新場次</button></div>
      <p>開新場次會清空回答並換一組 QR code，舊的 QR code 會失效。</p>
      <p id="d-relay"></p>
      <div class="row" style="margin-top:.4rem"><button class="plain" id="d-switch">切換連線線路</button></div>
    </section>
  </aside>
  <dialog class="zoom" id="zoom"></dialog>
</template>

<template id="t-quad">
  <div class="q-body">
    <button class="q-qr" type="button"><span>掃描後先填學號</span></button>
    <div class="q-head">
      <div class="q-letter"></div>
      <div class="q-title"><h2></h2><p class="q-prompt"></p></div>
    </div>
    <ul class="q-list" aria-live="polite"></ul>
  </div>
  <div class="q-foot"><span class="num q-count">0 則</span><button class="link q-add" type="button">＋ 代為輸入</button></div>
</template>

<template id="t-student">
  <header class="s-top"><strong id="s-co">商業模式畫布</strong><span class="tag">商業模式畫布</span></header>
  <nav class="s-tabs" id="s-tabs" aria-label="選擇區塊"></nav>
  <main class="s-main" id="s-main">
    <div class="s-q"><div class="q-letter" id="s-letter"></div><h1 id="s-title"></h1></div>
    <p class="s-ask" id="s-ask"></p>
    <form class="s-form" id="s-form" novalidate>
      <p class="s-note" id="s-note"></p>
      <label><span>學號（必填）</span><input id="s-nick" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="s-note" placeholder="只填學號，例如 B11234567"></label>
      <label><span>你的想法 <i id="s-left">0 / 60</i></span>
        <textarea id="s-text" rows="3" maxlength="60" placeholder="一則寫一個重點，可以送出很多則"></textarea></label>
      <button class="s-send" id="s-send" disabled>連線中…</button>
    </form>
    <p class="s-status" id="s-status" role="status"></p>
    <h2 class="s-h" id="s-h" hidden>你送出的回答</h2>
    <ul class="s-sent" id="s-sent"></ul>
    <section class="s-teach" id="s-teach" hidden>
      <h2>老師模式 <button type="button" class="plain" id="t-lock">暫停作答</button></h2>
      <p>你輸入的是老師學號。可以修改或刪除看板上的所有回答，也可以修改頁面文字。</p>
      <div id="t-all"></div>
      <details id="t-tx"><summary>修改頁面文字</summary><form class="t-form" id="t-form"></form></details>
    </section>
  </main>
  <footer class="s-foot" id="s-foot"></footer>
</template>

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }

  const n = normName(name), low = String(name).toLowerCase(); if (!n) return null;
  let best = null, bl = 0;
  for (const b of BRANDS) for (let i = 0; i < b.keys.length; i++) {
    const k = b.keys[i];
    if (n === k) return b;
    const latin = /^[\x00-\x7f]+$/.test(k);
    const hit = latin
      ? k.length >= 3 && new RegExp('(^|[^a-z0-9])' + b.raw[i].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(low)
      : k.length >= 2 && n.includes(k);
    if (hit && k.length > bl) { best = b; bl = k.length; }
  }
  return best;
}
function autoColors(name) {
  const b = findBrand(name);
  if (b) return { colors: b.colors.slice(), known: true };
  let h = 2166136261; for (const ch of normName(name) || 'swot') { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const hue = h % 360;
  return { colors: [hsl2hex(hue, 62, 36), hsl2hex((hue + 205) % 360, 28, 22), hsl2hex((hue + 32) % 360, 70, 58)], known: false };
}
function applyIdentity(colors, font) {
  const [c1, c2, c3] = colors;
  const c4 = lum(c1) < .03 ? mix(c1, '#ffffff', .24) : mix(c1, '#101318', .84);
  const r = document.documentElement.style;
  [c1, c2, c3, c4].forEach((c, i) => { r.setProperty('--c' + (i + 1), c); r.setProperty('--on' + (i + 1), onColor(c)); });
  document.documentElement.classList.toggle('f-serif', font === 'serif');
  $('meta[name="theme-color"]')?.remove();
  const m = document.createElement('meta'); m.name = 'theme-color'; m.content = c1; document.head.append(m);
}
const DEFAULT_COLORS = ['#27506e', '#16303f', '#7fa8c4'];

function qrSvg(text) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 3; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-m} ${-m} ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect x="${-m}" y="${-m}" width="${n + 2 * m}" height="${n + 2 * m}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

let toastTimer;
function toast(msg, ms = 4200) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms); }

function connect(uri, h) {
  const c = new Paho.Client(uri, 'sw' + rid(14));
  c.onMessageArrived = m => { let d; try { d = JSON.parse(m.payloadString); } catch { return; } h.msg(m.destinationName, d); };
  c.onConnectionLost = () => h.down && h.down();
  c.onConnected = () => h.up && h.up(c);
  return new Promise((res, rej) => c.connect({ timeout: 8, keepAliveInterval: 25, cleanSession: true, reconnect: true, mqttVersion: 4, mqttVersionExplicit: true, onSuccess: () => res(c), onFailure: rej }));
}
function send(c, t, obj, retained = false) {
  if (!c || !c.isConnected()) return false;
  try { const m = new Paho.Message(obj === null ? '' : JSON.stringify(obj)); m.destinationName = t; m.qos = 1; m.retained = retained; c.send(m); return true; } catch { return false; }
}

/* ════════════ 老師看板 ════════════ */
function host() {
  document.body.className = 'host';
  document.body.prepend($('#t-host').content.cloneNode(true));
  const S = Object.assign({ room: rid(6), company: '', colors: null, font: 'sans', logo: '', locked: false, names: true, answers: [], removed: [], relay: 0, tid: '000000', tx: {} }, store.get('bmclive.host', {}));

  if (!S.tx || typeof S.tx !== 'object') S.tx = {};

  if (!(S.relay < RELAYS.length)) S.relay = 0;
  const save = () => { if (!store.set('bmclive.host', S) && S.logo) { S.logo = ''; store.set('bmclive.host', S); } };
  const fresh = new Map(), pending = new Set();
  let client = null, up = false, editing = false, tActive = 0;
  const el = { list: {}, count: {}, qr: {}, prompt: {} };

  $('#brands').append(...BRANDS.map(b => { const o = document.createElement('option'); o.value = b.names[0]; return o; }));
  for (const sec of $$('.quad')) {
    const q = sec.dataset.q; sec.append($('#t-quad').content.cloneNode(true));
    $('.q-letter', sec).innerHTML = ico(q);
const h2 = $('h2', sec); for (const f of ['zh', 'en']) { const sp = document.createElement('span'); sp.className = f; sp.dataset.tx = q + '.' + f; h2.append(sp); }
    $('.q-prompt', sec).dataset.tx = q + '.ask';
    el.list[q] = $('.q-list', sec); el.count[q] = $('.q-count', sec); el.qr[q] = $('.q-qr', sec); el.prompt[q] = $('.q-prompt', sec);
    el.qr[q].addEventListener('click', () => zoom(q));
    $('.q-add', sec).addEventListener('click', e => addInline(q, e.currentTarget));
    el.list[q].addEventListener('click', e => { const b = e.target.closest('.x'); if (b) removeAnswer(b.dataset.id); });
  }

  const colors = () => (S.colors && S.colors.every(isHex) ? S.colors : (S.company ? autoColors(S.company).colors : DEFAULT_COLORS));
  const joinUrl = q => location.href.split('#')[0] + '#' + S.room + '-' + q + S.relay;
  const stateMsg = () => ({ n: S.company, c: colors(), f: S.font, l: S.locked, x: S.tx, h: hash(S.room + '|' + S.tid), v: Date.now() });
  let pubT; const publishState = () => { clearTimeout(pubT); pubT = setTimeout(() => send(client, topic(S.room, 's'), stateMsg(), true), 120); };

  const T = k => txGet(S.tx, k, S.company);
  function setCE(e) {
    if (!editing) return e.removeAttribute('contenteditable');
    try { e.contentEditable = 'plaintext-only'; } catch { e.contentEditable = 'true'; }
    e.spellcheck = false;
  }
  function renderTexts() {
    for (const e of $$('[data-tx]')) { if (document.activeElement !== e) e.textContent = T(e.dataset.tx); setCE(e); }
    for (const q of QK) el.qr[q].setAttribute('aria-label', `放大「${T(q + '.zh')}」的 QR code`);
    const note = $('#d-note'); if (document.activeElement !== note) note.value = T('note');
    const tid = $('#d-tid'); if (document.activeElement !== tid) tid.value = S.tid;
    renderEye();
  }
  function setTx(k, v, quiet) {
    v = txClean(k, v);
    if (!v || v === txDefault(k, S.company)) delete S.tx[k]; else S.tx[k] = v;
    if (quiet) return;
    save(); renderTexts(); publishState();
  }
  function renderIdentity() {
    applyIdentity(colors(), S.font);
    renderTexts();
    const inp = $('#company'); if (document.activeElement !== inp) inp.value = S.company;
    document.title = (S.company ? S.company + ' ' : '') + '商業模式畫布即時看板';
    const lg = $('#logo'); lg.hidden = !S.logo; if (S.logo) lg.src = S.logo; else lg.removeAttribute('src');
    const c = colors(); ['col1', 'col2', 'col3'].forEach((id, i) => { $('#' + id).value = c[i]; });
    $$('#d-font button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === S.font));
    $('#d-names').checked = S.names; document.body.classList.toggle('names-off', !S.names);
    const lock = $('#b-lock'); lock.setAttribute('aria-pressed', S.locked); lock.textContent = S.locked ? '已暫停作答' : '暫停作答';
    $('#d-src').textContent = S.colors ? '目前使用你自訂的顏色。' : !S.company ? '輸入公司名稱後會自動套用配色。' : autoColors(S.company).known ? `已套用內建的「${findBrand(S.company).names[0]}」品牌色（近似值），可依該公司的識別規範微調。` : '這家公司沒有內建品牌色，目前是依名稱自動產生的配色。請改成該公司的標準色。';
  }
  function renderQR() {
    for (const q of QK) {
      const b = el.qr[q]; b.querySelector('svg, .q-off')?.remove();
      if (OFFLINE) { b.insertAdjacentHTML('afterbegin', '<div class="q-off">尚未上線<br>還不能掃描</div>'); b.lastElementChild.textContent = '點此看上線步驟'; b.style.cursor = 'help'; continue; }
      b.insertAdjacentHTML('afterbegin', qrSvg(joinUrl(q))); b.dataset.url = joinUrl(q);
    }
    $('#roomcode').textContent = $('#d-room').textContent = S.room.toUpperCase();
    $('#d-relay').textContent = `連線線路 ${S.relay + 1} / ${RELAYS.length}：${RELAYS[S.relay].replace(/^wss?:\/\//, '').split(/[:/]/)[0]}`;
  }
  function ansNode(a) {
    const li = document.createElement('li'); li.className = 'ans';
    const age = Date.now() - (fresh.get(a.id) || 0);
    if (age < 2600) { li.classList.add('fresh'); li.style.animationDelay = -age + 'ms'; }
li.dataset.id = a.id;
    const t = document.createElement('span'); t.className = 't'; t.dataset.f = 't'; t.textContent = a.t; setCE(t); li.append(t);
    if (a.n || editing) { const n = document.createElement('span'); n.className = 'n'; n.dataset.f = 'n'; n.textContent = a.n; setCE(n); li.append(n); }
    const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.dataset.id = a.id; x.textContent = '✕'; x.setAttribute('aria-label', '移除這則回答'); li.append(x);
    return li;
  }
  function renderList(q) {
    if (el.list[q].contains(document.activeElement) && document.activeElement.isContentEditable) { pending.add(q); return; }

    else { const li = document.createElement('li'); li.className = 'q-empty'; li.textContent = '還沒有回答。掃描 QR code，先輸入學號再作答。'; el.list[q].replaceChildren(li); }
    const n = items.length; el.list[q].style.setProperty('--fs', n <= 4 ? '1.02rem' : n <= 8 ? '.92rem' : n <= 14 ? '.82rem' : n <= 24 ? '.74rem' : '.68rem');
    el.count[q].textContent = n + ' 則';
    $('#total').textContent = S.answers.length;
  }
  const renderAll = () => { renderIdentity(); renderQR(); QK.forEach(renderList); };

  function addAnswer(a) {
    if (S.answers.some(x => x.id === a.id) || S.removed.includes(a.id)) return false;
    if (S.answers.length >= 800) return false;
    S.answers.push(a); fresh.set(a.id, Date.now()); save(); renderList(a.q); pushAll(); return true;
  }
  function removeAnswer(id) {
    const a = S.answers.find(x => x.id === id); if (!a) return;
    S.answers = S.answers.filter(x => x.id !== id); S.removed = [...S.removed, id].slice(-300); save(); renderList(a.q); pushAll();
  }
  function editAnswer(id, ch) {
    const a = S.answers.find(x => x.id === id); if (!a) return;
    if (ch.t !== undefined) { const t = clean(ch.t, 80); if (t) a.t = t; }
    if (ch.n !== undefined) a.n = sid(ch.n);
    save(); renderList(a.q); pushAll();
  }
  /* 老師用手機進入老師模式後，把全部回答送過去，並接受修改指令 */
  let allT;
  function pushAll() {
    if (Date.now() - tActive > 15 * 60000) return;
    clearTimeout(allT); allT = setTimeout(() => send(client, topic(S.room, 'all'), { a: S.answers.map(a => ({ i: a.id, q: a.q, t: a.t, n: a.n })) }), 200);
  }
  function onTeacher(d) {
    if (sid(d.k) !== S.tid) return;
    tActive = Date.now();
    if (d.op === 'edit') editAnswer(clean(d.i, 24), { t: d.t, n: d.n });
    else if (d.op === 'del') removeAnswer(clean(d.i, 24));
    else if (d.op === 'lock') { S.locked = !!d.l; save(); renderIdentity(); publishState(); }
    else if (d.op === 'tx' && d.x && typeof d.x === 'object') { for (const k of TXK) if (typeof d.x[k] === 'string') setTx(k, d.x[k], true); save(); renderTexts(); publishState(); }
    pushAll();
  }
  let ackIds = [], ackT;
  function ack(id) { ackIds.push(id); clearTimeout(ackT); ackT = setTimeout(() => { send(client, topic(S.room, 'k'), { ids: ackIds.splice(0) }); }, 150); }
  function onMsg(t, d) {
    if (!d || typeof d !== 'object') return;
    if (t === topic(S.room, 'hi')) return publishState();
    if (t === topic(S.room, 't')) return onTeacher(d);
    if (t !== topic(S.room, 'a') || S.locked) return;
    const id = clean(d.i, 24), q = d.q, text = clean(d.t, 80);
    if (!/^[a-z0-9]{6,24}$/.test(id) || !Q[q] || !text) return;
    addAnswer({ id, q, t: text, n: sid(d.n), ts: Date.now() });
    ack(id);
  }
  function addInline(q, btn) {
    const f = document.createElement('form'); const i = document.createElement('input'); i.maxLength = 60; i.placeholder = `代為輸入「${T(q + '.zh')}」，按 Enter`; i.setAttribute('aria-label', i.placeholder);
    const ok = document.createElement('button'); ok.textContent = '加入'; const no = document.createElement('button'); no.type = 'button'; no.textContent = '取消';
    f.append(i, ok, no); btn.replaceWith(f); i.focus();
    f.addEventListener('submit', e => { e.preventDefault(); const t = clean(i.value, 80); if (t) addAnswer({ id: rid(10), q, t, n: S.tid, ts: Date.now() }); i.value = ''; i.focus(); });
    no.addEventListener('click', () => f.replaceWith(btn));
  }
  function guide() {
    const d = $('#zoom'); d.className = 'zoom guide'; d.replaceChildren();
    const add = (tag, html) => { const e = document.createElement(tag); e.innerHTML = html; d.append(e); return e; };
    add('h2', '先把檔案放上網路，學生才掃得到');
    add('p', '這個檔案目前是從這台電腦直接開啟的，QR code 裡只會是電腦裡的檔案路徑，手機打不開，所以相機會顯示「找不到可用的資料」。把檔案放到任何 <b>https://</b> 開頭的網址後，QR code 就會自動變成可掃描的。');
    add('p', '<b>用 GitHub Pages（免費）的做法：</b>');
    add('ol', '<li>到 <code>github.com</code> 註冊並登入。</li><li>右上角「＋」→ <b>New repository</b>。名稱填 <code>bmc</code>，選 <b>Public</b>，按 <b>Create repository</b>。</li><li>在新頁面點 <b>uploading an existing file</b>，把這個檔案（檔名請用 <code>index.html</code>）拖進去，按 <b>Commit changes</b>。</li><li>點 <b>Settings</b> → 左側 <b>Pages</b> → Source 選 <b>Deploy from a branch</b>，Branch 選 <b>main</b> 和 <b>/(root)</b>，按 <b>Save</b>。</li><li>等幾分鐘（最長約 10 分鐘），在教室電腦用 <code>https://你的帳號.github.io/bmc/</code> 開啟看板。</li>');
    add('p', '學校的網頁空間或其他靜態網站服務也可以，只要網址是 https:// 開頭。');
    const b = add('button', '關閉'); b.className = 'plain'; b.dataset.close = '1';
    d.showModal();
  }
  function zoom(q) {
    if (OFFLINE) return guide();
    const d = $('#zoom'); d.className = 'zoom'; d.dataset.q = q; d.replaceChildren();
    const h = document.createElement('h2'); const i = document.createElement('i'); i.innerHTML = ico(q); h.append(i, `${T(q + '.zh')}　掃描作答`);
    const p = document.createElement('p'); p.textContent = joinUrl(q);
    const r = document.createElement('p'); r.className = 'remind'; r.textContent = T('remind');
    d.append(h); d.insertAdjacentHTML('beforeend', qrSvg(joinUrl(q))); d.append(r, p);

  }
  $('#zoom').addEventListener('click', e => { const d = e.currentTarget; if (!d.classList.contains('guide') || e.target === d || e.target.closest('[data-close]')) d.close(); });

  /* 確認列：取代瀏覽器的 confirm() */

    const bar = document.createElement('div'); bar.className = 'bar'; const s = document.createElement('span'); s.textContent = msg;
    const y = document.createElement('button'); y.className = 'go'; y.textContent = yes; const n = document.createElement('button'); n.textContent = '取消';
    bar.append(s, y, n); $('#bars').replaceChildren(...$$('#bars .bar.keep'), bar); y.focus();
    y.addEventListener('click', () => { bar.remove(); fn(); }); n.addEventListener('click', () => { bar.remove(); cancel && cancel(); });
  }
  function newRoom() {
    const old = S.room; send(client, topic(old, 's'), null, true);
    try { client && client.isConnected() && ['a', 'hi', 't'].forEach(l => client.unsubscribe(topic(old, l))); } catch {}
    S.room = rid(6); S.answers = []; S.removed = []; fresh.clear(); save(); subscribe(); renderAll();
  }
  function setCompany(name) {
    name = clean(name, 30); if (name === S.company) return renderIdentity();
    const go = () => {
      const hadAnswers = S.answers.length > 0;
      S.company = name; S.colors = null; for (const q of QK) delete S.tx[q + '.ask']; save();
      if (hadAnswers) newRoom(); else { renderAll(); publishState(); }
      if (name) toast(autoColors(name).known ? `已套用「${findBrand(name).names[0]}」的品牌色（近似值），可在「設定」微調。` : `沒有內建「${name}」的品牌色，已自動配色。請在「設定」改成該公司的標準色。`, 6000);
    };
    if (S.answers.length) ask(`把公司換成「${name || '（未命名）'}」會清空目前 ${S.answers.length} 則回答，並換一組 QR code。`, '更換公司', go, () => { co.value = S.company; }); else go();

  $('#b-set').addEventListener('click', () => { $('#drawer').hidden = !$('#drawer').hidden; });

  $('#b-edit').addEventListener('click', e => {
    editing = !editing; document.body.classList.toggle('editing', editing);
    e.currentTarget.setAttribute('aria-pressed', editing); e.currentTarget.textContent = editing ? '完成編輯' : '編輯內容';
    $('#bars .edit-hint')?.remove();
    if (editing) { const bar = document.createElement('div'); bar.className = 'bar keep edit-hint'; bar.textContent = '編輯模式：點任何文字或回答就能修改，按 Enter 或點別處儲存，按 Esc 取消。把文字清空會還原成預設內容。'; $('#bars').append(bar); }
    renderTexts(); pending.clear(); QK.forEach(renderList);
  });
  document.addEventListener('keydown', e => {
    const t = e.target; if (!t.isContentEditable) return;
    if (e.key === 'Escape') { t.dataset.cancel = '1'; t.blur(); }
    else if (e.key === 'Enter' && t.dataset.tx !== 'foot') { e.preventDefault(); t.blur(); }
  });
  document.addEventListener('focusout', e => {
    const t = e.target; if (!t.dataset || !(t.dataset.tx || t.dataset.f) || !t.hasAttribute('contenteditable')) return;
    const cancel = t.dataset.cancel; delete t.dataset.cancel; const val = t.innerText;
    setTimeout(() => {
      if (t.dataset.tx) { if (cancel) renderTexts(); else setTx(t.dataset.tx, val); }
      else { const li = t.closest('.ans'); if (li && !cancel) editAnswer(li.dataset.id, { [t.dataset.f]: val }); for (const q of [...pending]) { pending.delete(q); renderList(q); } if (li && cancel) renderList(li.closest('.quad').dataset.q); }
    }, 0);
  });
  /* 老師學號旁的眼睛：切換顯示或隱藏，偏好記在這台電腦 */
  const MASK_CSS = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('-webkit-text-security', 'disc');
  function renderEye() {

  }

  $('#d-tid').addEventListener('input', e => { const v = sid(e.target.value); if (v !== e.target.value) e.target.value = v; });
  $('#d-tid').addEventListener('change', e => {
    const v = sid(e.target.value);
    if (!sidOk(v)) { toast('老師學號至少要 4 碼英數字。'); e.target.value = S.tid; return; }
    S.tid = v; save(); publishState(); toast(S.showTid ? `老師學號已改成 ${v}。` : '老師學號已更新。');
  });
  $('#d-note').addEventListener('change', e => setTx('note', e.target.value));
  $('#d-txreset').addEventListener('click', () => ask('確定把所有文字還原成預設內容？回答不受影響。', '還原文字', () => { S.tx = {}; save(); renderTexts(); publishState(); }));
  $('#d-close').addEventListener('click', () => { $('#drawer').hidden = true; });
  $('#b-full').addEventListener('click', () => { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen())?.catch?.(() => toast('這個瀏覽器不支援全螢幕。')); });
  ['col1', 'col2', 'col3'].forEach((id, i) => $('#' + id).addEventListener('input', e => { const c = colors().slice(); c[i] = e.target.value; S.colors = c; save(); applyIdentity(c, S.font); $('#d-src').textContent = '目前使用你自訂的顏色。'; publishState(); }));
  $('#d-auto').addEventListener('click', () => { S.colors = null; save(); renderIdentity(); publishState(); });
  $('#d-font').addEventListener('click', e => { const f = e.target.dataset.f; if (!f) return; S.font = f; save(); renderIdentity(); publishState(); });
  $('#d-names').addEventListener('change', e => { S.names = e.target.checked; save(); renderIdentity(); });
  $('#d-logo').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 600 * 1024) return toast('圖檔請小於 600 KB。');
    const r = new FileReader(); r.onload = () => { S.logo = String(r.result); save(); renderIdentity(); }; r.readAsDataURL(f);
  });
  $('#d-logo-x').addEventListener('click', () => { S.logo = ''; $('#d-logo').value = ''; save(); renderIdentity(); });
  $('#d-clear').addEventListener('click', () => ask(`確定清空目前 ${S.answers.length} 則回答？QR code 不變。`, '清空回答', () => { S.removed = [...S.removed, ...S.answers.map(a => a.id)].slice(-300); S.answers = []; save(); QK.forEach(renderList); pushAll(); }));
  $('#d-new').addEventListener('click', () => ask('開新場次會清空回答並換一組 QR code。', '開新場次', newRoom));
  $('#d-csv').addEventListener('click', () => {
    const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [['區塊', '回答', '學號', '時間'], ...S.answers.map(a => [T(a.q + '.zh'), a.t, a.n, new Date(a.ts).toLocaleString('zh-TW')])];
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n')], { type: 'text/csv' }));
    a.download = `BMC_${S.company || '看板'}_${S.room}.csv`; document.body.append(a); a.click(); a.remove();
  });
  $('#d-switch').addEventListener('click', () => { S.relay = (S.relay + 1) % RELAYS.length; save(); start(true); });

  function setConn(state, text) { const c = $('#conn'); c.firstElementChild.className = 'dot ' + state; c.lastElementChild.textContent = text; }
  function subscribe() { if (!client || !client.isConnected()) return; client.subscribe(topic(S.room, 'a'), { qos: 1 }); client.subscribe(topic(S.room, 'hi'), { qos: 0 }); client.subscribe(topic(S.room, 't'), { qos: 1 }); publishState(); }
  async function start(manual) {
    try { client && client.disconnect(); } catch {} client = null; up = false;
    setConn('', '連線中'); renderQR();
    for (let n = 0; n < RELAYS.length; n++) {
      const i = (S.relay + n) % RELAYS.length;
      try {
        client = await connect(RELAYS[i], { msg: onMsg, down: () => { up = false; setConn('down', '連線中斷，重新連線中'); }, up: c => { client = c; up = true; setConn('up', '已連線'); subscribe(); } });
        if (i !== S.relay) { S.relay = i; save(); }
        renderQR(); if (manual) toast('已切換線路，QR code 已更新。'); return;
      } catch { /* 換下一條線路 */ }
    }
    setConn('down', '無法連線'); toast('連不上即時線路。請確認這台電腦可以上網，或到「設定」切換連線線路。', 8000);
  }
  setInterval(() => { if (up) send(client, topic(S.room, 's'), stateMsg(), true); }, 30000);

  if (OFFLINE) {
    const bar = document.createElement('div'); bar.className = 'bar keep';
    const t = document.createElement('span'); t.textContent = '學生還掃不到 QR code：這個檔案目前是從這台電腦直接開啟的。請先把它放到 https:// 開頭的網址，再用那個網址開啟看板。';
    const b = document.createElement('button'); b.className = 'go'; b.textContent = '看上線步驟'; b.addEventListener('click', guide);
    bar.append(t, b); $('#bars').append(bar);
  }
  renderAll(); start();
  if (!S.company) co.focus();
}

/* ════════════ 學生作答頁 ════════════ */
function student(room, q0, bi) {
  document.documentElement.classList.add('stu');
  document.body.className = 'student';
  document.body.prepend($('#t-student').content.cloneNode(true));
  let q = q0, client = null, locked = false, seen = false, cool = false, teacher = false, all = [], tEdit = '', txDirty = false;
  const me = store.get('bmclive.me', { nick: '' });
  const key = 'bmclive.sent.' + room;
  let sent = store.get(key, []).map(x => (x.st === 'sending' ? { ...x, tries: 0 } : x));
  let ident = store.get('bmclive.id.' + room, { n: '', c: DEFAULT_COLORS, f: 'sans', x: {}, h: '' });
  const T = k => txGet(ident.x, k, clean(ident.n, 30));
  const $text = $('#s-text'), $send = $('#s-send'), $status = $('#s-status');
  const $sid = $('#s-nick'); $sid.value = sid(me.nick);
  $sid.addEventListener('input', () => { const v = sid($sid.value); if (v !== $sid.value) $sid.value = v; $sid.classList.remove('bad'); checkTeacher(); });

  $('#s-tabs').append(...QK.map(k => { const b = document.createElement('button'); b.type = 'button'; b.dataset.q = k; const L = document.createElement('b'); L.innerHTML = ico(k); const s = document.createElement('small'); b.append(L, s); return b; }));
  $('#s-tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { q = b.dataset.q; render(); $text.focus(); } });

  function render() {
    applyIdentity(ident.c && ident.c.length === 3 && ident.c.every(isHex) ? ident.c : DEFAULT_COLORS, ident.f);
    const name = clean(ident.n, 30);
    $('#s-co').textContent = name || '商業模式畫布'; $('.s-top .tag').hidden = !name;
    document.title = (name ? name + ' ' : '') + '商業模式畫布作答';
    $$('#s-tabs button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.q === q); b.lastElementChild.textContent = T(b.dataset.q + '.zh'); });
    $('#s-note').textContent = T('note'); $('#s-foot').textContent = T('foot');
    $('#s-main').dataset.q = q;
    $('#s-letter').innerHTML = ico(q);
    const h = $('#s-title'); h.textContent = T(q + '.zh'); const sp = document.createElement('span'); sp.textContent = T(q + '.en'); h.append(sp);
    $('#s-ask').textContent = T(q + '.ask');
    const online = client && client.isConnected();
    $send.disabled = !online || locked || cool;
    $send.textContent = locked ? '老師已暫停作答' : !online ? '連線中…' : `送出到「${T(q + '.zh')}」`;
    $text.disabled = locked;
    $('#s-left').textContent = `${[...$text.value].length} / 60`;
    $('#s-h').hidden = !sent.length;
    $('#s-sent').replaceChildren(...sent.slice().reverse().map(x => {
      const li = document.createElement('li'); li.dataset.q = x.q;
      const b = document.createElement('b'); b.textContent = T(x.q + '.zh'); const s = document.createElement('span'); s.textContent = x.t;
      const em = document.createElement('em'); em.className = x.st;
      if (x.st === 'failed') { const r = document.createElement('button'); r.className = 'link'; r.type = 'button'; r.textContent = '未送達，點此重送'; r.addEventListener('click', () => { x.st = 'sending'; x.tries = 0; push(x); render(); }); em.append(r); }
      else em.textContent = x.st === 'shown' ? '✓ 已顯示在螢幕上' : '傳送中…';
      li.append(b, s, em); return li;
    }));
    renderTeacher();
  }
  /* ── 老師模式：學號欄輸入老師學號後出現 ── */
  const tSend = o => send(client, topic(room, 't'), { ...o, k: sid($sid.value) });
  const mk = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
  function checkTeacher() {
    const id = sid($sid.value), now = sidOk(id) && !!ident.h && hash(room + '|' + id) === ident.h;
    if (now === teacher) return;
    teacher = now; tEdit = ''; txDirty = false;
    if (client && client.isConnected()) { try { teacher ? client.subscribe(topic(room, 'all'), { qos: 1 }) : client.unsubscribe(topic(room, 'all')); } catch {} if (teacher) tSend({ op: 'list' }); }
    renderTeacher();
  }
  function renderTeacher() {
    const box = $('#s-teach'); box.hidden = !teacher; if (!teacher) return;
    $('#t-lock').textContent = locked ? '恢復作答' : '暫停作答';
    if (!box.contains(document.activeElement) || !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
      $('#t-all').replaceChildren(...QK.flatMap(k => {
        const items = all.filter(a => a.q === k).reverse();
        const h = mk('h3'); h.dataset.q = k; const ib = mk('b'); ib.innerHTML = ico(k); h.append(ib, `${T(k + '.zh')}（${items.length} 則）`);
        const ul = mk('ul', null, 't-list');
        ul.append(...items.map(a => {
          const li = mk('li'); li.dataset.id = a.i;
          if (tEdit === a.i) {
            const it = mk('input'); it.value = a.t; it.maxLength = 80; it.setAttribute('aria-label', '回答內容');
            const inn = mk('input'); inn.value = a.n; inn.maxLength = 12; inn.placeholder = '學號'; inn.setAttribute('aria-label', '學號');
            const acts = mk('div', null, 'acts'); const ok = mk('button', '儲存', 'plain'); ok.type = 'button'; ok.dataset.act = 'save'; const no = mk('button', '取消', 'plain'); no.type = 'button'; no.dataset.act = 'cancel';
            acts.append(ok, no); li.append(it, inn, acts);
          } else {
            const sp = mk('span', a.t); if (a.n) sp.append(mk('small', a.n));
            const acts = mk('div', null, 'acts'); const ed = mk('button', '修改', 'plain'); ed.type = 'button'; ed.dataset.act = 'edit'; const del = mk('button', '刪除', 'plain danger'); del.type = 'button'; del.dataset.act = 'del';
            acts.append(ed, del); li.append(sp, acts);
          }
          return li;
        }));
        return items.length ? [h, ul] : [h];
      }));
    }
    const form = $('#t-form');
    if (!txDirty && !form.contains(document.activeElement)) {
      form.replaceChildren(...TXK.map(k => {
        const lab = mk('label', TXLABEL(k)); const long = !/\.(zh|en)$/.test(k);
        const f = mk(long ? 'textarea' : 'input'); f.name = k; f.value = T(k); if (long) f.rows = k === 'foot' ? 5 : 2;
        lab.append(f); return lab;
      }), (() => { const b = mk('button', '儲存文字', 'plain'); return b; })());
    }
  }
  $('#t-form').addEventListener('input', () => { txDirty = true; });
  $('#t-form').addEventListener('submit', e => {
    e.preventDefault(); const x = {}; for (const f of e.currentTarget.elements) if (f.name) x[f.name] = f.value;
    if (tSend({ op: 'tx', x })) { txDirty = false; $status.className = 's-status'; $status.textContent = '頁面文字已送出，看板與學生手機會立刻更新。'; }
  });
  $('#t-lock').addEventListener('click', () => tSend({ op: 'lock', l: !locked }));
  $('#t-all').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const li = b.closest('li'), id = li.dataset.id, act = b.dataset.act;
    if (act === 'edit') { tEdit = id; document.activeElement.blur(); renderTeacher(); li.isConnected || $(`#t-all li[data-id="${id}"] input`)?.focus(); }
    else if (act === 'cancel') { tEdit = ''; document.activeElement.blur(); renderTeacher(); }
    else if (act === 'save') { const [it, inn] = $$('input', li); tSend({ op: 'edit', i: id, t: it.value, n: inn.value }); const a = all.find(z => z.i === id); if (a) { a.t = clean(it.value, 80) || a.t; a.n = sid(inn.value); } tEdit = ''; document.activeElement.blur(); renderTeacher(); }
    else if (act === 'del') {
      if (b.dataset.sure) { tSend({ op: 'del', i: id }); all = all.filter(z => z.i !== id); renderTeacher(); }
      else { b.dataset.sure = '1'; b.textContent = '確定刪除？'; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = '刪除'; } }, 3000); }
    }
  });
  const persist = () => store.set(key, sent.slice(-40));
  function push(x) { x.tries = (x.tries || 0) + 1; send(client, topic(room, 'a'), { i: x.id, q: x.q, t: x.t, n: x.n }); }

  $text.addEventListener('input', () => { $('#s-left').textContent = `${[...$text.value].length} / 60`; });
  $('#s-form').addEventListener('submit', e => {
    e.preventDefault();
    if (locked) return;
    const id = sid($sid.value); $sid.value = id;
    if (!sidOk(id)) { $sid.classList.add('bad'); $status.className = 's-status bad'; $status.textContent = '請先輸入學號（只填學號，至少 4 碼英數字），再送出回答。'; $sid.focus(); return; }
    const t = clean($text.value, 60);
    if (!t) { $status.className = 's-status bad'; $status.textContent = '請先寫下你的想法。'; $text.focus(); return; }
    me.nick = id; store.set('bmclive.me', me);
    const x = { id: rid(12), q, t, n: me.nick, st: 'sending', tries: 0 };
    sent.push(x); persist(); push(x);
    $text.value = ''; cool = true; setTimeout(() => { cool = false; render(); }, 1500);
    $status.className = 's-status'; $status.textContent = '已送出，可以繼續寫下一則。';
    render(); $text.focus();
  });
  setInterval(() => {
    let changed = false;
    for (const x of sent) if (x.st === 'sending') { if (x.tries >= 8) { x.st = 'failed'; changed = true; } else if (!locked && client && client.isConnected()) push(x); }
    if (changed) { persist(); render(); }
  }, 4000);

  function onMsg(t, d) {
    if (!d || typeof d !== 'object') return;
    if (t === topic(room, 's')) {
      seen = true; locked = !!d.l;
      const x = {}; if (d.x && typeof d.x === 'object') for (const k of TXK) if (typeof d.x[k] === 'string' && txClean(k, d.x[k])) x[k] = txClean(k, d.x[k]);
      ident = { n: clean(d.n, 30), c: Array.isArray(d.c) ? d.c.slice(0, 3).map(String) : DEFAULT_COLORS, f: d.f === 'serif' ? 'serif' : 'sans', x, h: clean(d.h, 20) };
      store.set('bmclive.id.' + room, ident);
      if ($status.textContent.startsWith('等待')) $status.textContent = '';
      checkTeacher(); render();
    } else if (t === topic(room, 'all') && teacher && Array.isArray(d.a)) {
      all = d.a.slice(0, 800).filter(a => a && Q[a.q]).map(a => ({ i: clean(a.i, 24), q: a.q, t: clean(a.t, 80), n: sid(a.n) }));
      if (tEdit && !all.some(a => a.i === tEdit)) tEdit = '';
      renderTeacher();
    } else if (t === topic(room, 'k') && Array.isArray(d.ids)) {
      let hit = false; for (const x of sent) if (x.st !== 'shown' && d.ids.includes(x.id)) { x.st = 'shown'; hit = true; }
      if (hit) { persist(); render(); }
    }
  }
  async function start() {
    if (!(bi < RELAYS.length)) { $status.className = 's-status bad'; $status.textContent = '這個 QR code 無效，請重新掃描螢幕上的 QR code。'; return; }
    try {
      client = await connect(RELAYS[bi], {
        msg: onMsg, down: () => { $status.className = 's-status bad'; $status.textContent = '連線中斷，重新連線中…'; render(); },
        up: c => {
          c.subscribe(topic(room, 's'), { qos: 1 }); c.subscribe(topic(room, 'k'), { qos: 1 });
          send(c, topic(room, 'hi'), { t: 1 });
          if (teacher) { c.subscribe(topic(room, 'all'), { qos: 1 }); send(c, topic(room, 't'), { op: 'list', k: sid($sid.value) }); }
          $status.className = 's-status'; $status.textContent = '';
          setTimeout(() => { if (!seen && !$status.textContent) $status.textContent = '等待老師的看板回應…請確認看板還開在螢幕上。'; }, 6000);
          render();
        },
      });
      render();
    } catch {
      $status.className = 's-status bad'; $status.textContent = '連不上線，5 秒後自動重試。請確認手機可以上網。';
      setTimeout(start, 5000);
    }
  }
  render(); start();
}
})();
</script>
